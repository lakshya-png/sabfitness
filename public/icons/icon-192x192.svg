<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="sabGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6366f1" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="192" height="192" rx="42" fill="#090d16"/>
  <rect x="6" y="6" width="180" height="180" rx="36" fill="url(#sabGrad)" fill-opacity="0.12" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <g filter="url(#shadow)" transform="translate(42, 40)">
    <!-- Stylized modern Dumbbell / S lightning icon -->
    <rect x="18" y="50" width="72" height="12" rx="6" fill="#ffffff"/>
    <rect x="8" y="28" width="16" height="56" rx="8" fill="url(#sabGrad)"/>
    <rect x="84" y="28" width="16" height="56" rx="8" fill="url(#sabGrad)"/>
    <rect x="0" y="38" width="10" height="36" rx="5" fill="#818cf8"/>
    <rect x="98" y="38" width="10" height="36" rx="5" fill="#818cf8"/>
    <!-- Glowing core mark -->
    <circle cx="54" cy="56" r="6" fill="#60a5fa"/>
  </g>
</svg>
